name: Pubblica sito

on:
  push:
    branches: [main]
  schedule:
    # ogni notte alle 00:05 ora italiana (23:05 UTC): apre le sorprese del giorno
    - cron: "5 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genera sorprese
        env:
          SURPRISES_KEY: ${{ secrets.SURPRISES_KEY }}
        run: node tools/build.mjs
      - name: Prepara file del sito
        run: |
          mkdir _site
          cp -r index.html assets .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
